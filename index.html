<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Blog &amp; Article Lab B1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@400;600&display=swap">
<style>
/* Layout: cabecera fina + pestañas fijas; contenido a la izquierda (columna de lectura + panel lateral en escritorio). */
:root {
  --bg: #F4F5FA; --card: #FFFFFF; --ink: #101828; --muted: #536079; --line: #DDE1EC; --soft: #EDEFF8;
  --accent: #4338CA; --accent-ink: #FFFFFF; --accent-soft: #E8E7FB;
  --ok: #146C43; --ok-soft: #E1F3E8; --warn: #8F5400; --warn-soft: #FFF0D1; --bad: #B42318; --bad-soft: #FDE7E4;
  --c-title: #7C3AED; --c-hook: #C2255C; --c-body: #2563EB; --c-tips: #0F766E; --c-concl: #B45309; --c-cta: #15803D;
  --f-display: "Bricolage Grotesque", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C111F; --card: #151B2D; --ink: #E8ECF7; --muted: #9AA5BE; --line: #29324B; --soft: #1C2339;
    --accent: #A5ABFF; --accent-ink: #0C111F; --accent-soft: #252C57;
    --ok: #56D88F; --ok-soft: #14301F; --warn: #F4B63F; --warn-soft: #3A2B0C; --bad: #FF8A80; --bad-soft: #3D1A18;
    --c-title: #B79CFF; --c-hook: #F58BB1; --c-body: #7FA8FF; --c-tips: #46D4C1; --c-concl: #F2B14B; --c-cta: #62D98A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C111F; --card: #151B2D; --ink: #E8ECF7; --muted: #9AA5BE; --line: #29324B; --soft: #1C2339;
  --accent: #A5ABFF; --accent-ink: #0C111F; --accent-soft: #252C57;
  --ok: #56D88F; --ok-soft: #14301F; --warn: #F4B63F; --warn-soft: #3A2B0C; --bad: #FF8A80; --bad-soft: #3D1A18;
  --c-title: #B79CFF; --c-hook: #F58BB1; --c-body: #7FA8FF; --c-tips: #46D4C1; --c-concl: #F2B14B; --c-cta: #62D98A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6; margin: 0; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.9rem, 4.6vw, 3rem); font-weight: 800; }
h2 { font-size: clamp(1.4rem, 3vw, 1.8rem); font-weight: 700; }
h3 { font-size: 1.15rem; font-weight: 700; }
h4 { font-size: 1rem; font-weight: 700; }
p { margin: 0 0 .8em; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.xs { font-size: .78rem; }
.up { text-transform: uppercase; letter-spacing: .08em; font-size: .72rem; font-weight: 700; color: var(--muted); }

/* cabecera y pestañas */
.top { background: var(--card); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1.05rem; flex: none; }
.brand-name { font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; line-height: 1.1; }
.brand-sub { font-size: .78rem; color: var(--muted); }
.top-right { display: flex; align-items: center; gap: 10px; }
.meter { font-size: .8rem; color: var(--muted); text-align: right; line-height: 1.25; }
.meter b { color: var(--ink); font-variant-numeric: tabular-nums; }
.tabsbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--card); z-index: 30; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { flex: none; padding: 12px 14px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: .92rem; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }

main { padding-block: 28px 80px; }
.view { display: none; }
.view.on { display: block; }
.view > * + * { margin-top: 28px; }
.sec-head { display: grid; gap: 6px; margin-bottom: 14px; }
.sec-head p { color: var(--muted); margin: 0; max-width: 70ch; }

@media (max-width: 600px) { .meter { display: none; } .brand-sub { font-size: .72rem; } }
/* componentes */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.card.flat { background: var(--soft); border-color: transparent; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 880px) { .split { grid-template-columns: minmax(0, 1fr); } }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 9px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: .95rem; }
.btn:hover { filter: brightness(1.08); }
.btn.sec { background: transparent; color: var(--accent); }
.btn.sec:hover { background: var(--accent-soft); filter: none; }
.btn.sm { padding: 5px 11px; font-size: .84rem; border-radius: 8px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600; background: var(--soft); color: var(--muted); border: 1px solid transparent; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.seg-ctl { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg-ctl button { border: 0; background: transparent; padding: 7px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; color: var(--muted); font-size: .9rem; }
.seg-ctl button[aria-pressed="true"] { background: var(--card); color: var(--accent); box-shadow: 0 1px 3px rgba(16, 24, 40, .14); }
.pill-ctl { display: flex; gap: 6px; flex-wrap: wrap; }
.pill-ctl button { border: 1px solid var(--line); background: var(--card); padding: 5px 12px; border-radius: 999px; font-size: .84rem; cursor: pointer; font-weight: 600; color: var(--muted); }
.pill-ctl button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.field { display: grid; gap: 4px; }
.field label { font-size: .78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
select, input[type="text"], input[type="search"] { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; max-width: 100%; }
.bar { height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.ok > i { background: var(--ok); } .bar.warn > i { background: var(--warn); } .bar.bad > i { background: var(--bad); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: .92rem; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--soft); }
tr:last-child td { border-bottom: 0; }
td:first-child { font-weight: 700; white-space: nowrap; }
details { border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
details > summary { cursor: pointer; padding: 12px 16px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: "+"; font-size: 1.2rem; color: var(--muted); }
details[open] > summary::after { content: "−"; }
details > .inner { padding: 0 16px 16px; }
ul.tight { margin: 0; padding-left: 1.15em; } ul.tight li { margin: 2px 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.ic { width: 1em; height: 1em; vertical-align: -.125em; flex: none; }

/* PLAN */
.hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 32px; align-items: center; padding-block: 6px 8px; }
@media (max-width: 880px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.hero p.lead { font-size: 1.12rem; color: var(--muted); max-width: 56ch; margin-block: 14px 20px; }
.score-card .line { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin-block: 10px; align-items: end; }
.score-card .line .bar { grid-column: 1 / -1; }
.score-big { font-family: var(--f-display); font-weight: 800; font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }
.step { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 14px 16px; }
.step .n { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: .9rem; }
.step.done .n { background: var(--ok-soft); color: var(--ok); }
.time-line { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); overflow: hidden; }
.time-line > div { padding: 14px 16px; border-right: 1px solid var(--line); }
.time-line > div:last-child { border-right: 0; }
.time-line b.min { font-family: var(--f-display); font-size: 1.4rem; color: var(--accent); display: block; }

/* GÉNEROS / ESTRUCTURA */
.pair { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); overflow: hidden; }
.pair > div { padding: 14px 16px; }
.pair > div:first-child { border-right: 1px solid var(--line); font-family: var(--f-body); }
.pair > div:last-child { font-family: var(--f-serif); font-size: 1.06rem; }
.pair + .pair { margin-top: 10px; }
@media (max-width: 640px) { .pair { grid-template-columns: 1fr; } .pair > div:first-child { border-right: 0; border-bottom: 1px solid var(--line); } }
.tag-b, .tag-a { display: block; font-family: var(--f-body); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
.tag-b { color: var(--c-body); } .tag-a { color: var(--c-concl); }
.p-title { --pc: var(--c-title); } .p-hook { --pc: var(--c-hook); } .p-body { --pc: var(--c-body); }
.p-tips { --pc: var(--c-tips); } .p-concl { --pc: var(--c-concl); } .p-cta { --pc: var(--c-cta); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--pc); margin-right: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .82rem; color: var(--muted); }
.model { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 22px clamp(16px, 3vw, 30px); }
.model.is-article { font-family: var(--f-serif); font-size: 1.14rem; line-height: 1.7; }
.model.is-blog { font-size: 1.04rem; }
.model h3.mtitle { font-size: clamp(1.4rem, 3vw, 1.9rem); margin-bottom: 14px; }
.model.is-article h3.mtitle { font-family: var(--f-serif); font-weight: 600; }
.model p { margin: 0 0 1em; }
.seg { background: color-mix(in srgb, var(--pc) 15%, var(--card)); border-bottom: 2px solid var(--pc); padding: 1px 2px; cursor: pointer; border-radius: 3px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.seg:hover, .seg.sel { background: color-mix(in srgb, var(--pc) 32%, var(--card)); }
.note-list { display: grid; gap: 8px; }
.note { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 10px 12px; border-left: 4px solid var(--pc); background: var(--card); border-radius: 0 10px 10px 0; border-top: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: .92rem; }
.note.sel { background: color-mix(in srgb, var(--pc) 10%, var(--card)); }
.part { border-left: 4px solid var(--pc); }
.part summary b { font-family: var(--f-display); }
.budget { display: flex; height: 30px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); font-size: .72rem; font-weight: 700; }
.budget span { display: grid; place-items: center; background: color-mix(in srgb, var(--pc) 24%, var(--card)); color: var(--ink); white-space: nowrap; overflow: hidden; }
.teel { display: grid; gap: 8px; }
.teel > div { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; align-items: start; }
.teel .r { font-family: var(--f-display); font-weight: 800; font-size: 1.8rem; line-height: 1; color: var(--accent); }
.good { color: var(--ok); } .badc { color: var(--bad); }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 640px) { .cols2 { grid-template-columns: 1fr; } }
.li-ok li::marker { color: var(--ok); } .li-bad li::marker { color: var(--bad); }

/* CONECTORES */
.conn-card h3 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-size: 1.02rem; margin-bottom: 8px; }
.conn { padding: 9px 0; border-top: 1px solid var(--line); }
.conn:first-of-type { border-top: 0; }
.conn .w { font-weight: 700; }
.reg { font-size: .66rem; font-weight: 800; letter-spacing: .06em; padding: 1px 6px; border-radius: 5px; margin-left: 6px; vertical-align: 2px; }
.reg.b { background: color-mix(in srgb, var(--c-body) 18%, var(--card)); color: var(--c-body); }
.reg.a { background: color-mix(in srgb, var(--c-concl) 18%, var(--card)); color: var(--c-concl); }
.reg.x { background: var(--soft); color: var(--muted); }
.conn .ex { font-style: italic; color: var(--ink); }
.trap { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); overflow: hidden; }
.trap > div { padding: 10px 14px; }
.trap .x { background: var(--bad-soft); } .trap .v { background: var(--ok-soft); }
.trap .why { grid-column: 1 / -1; font-size: .86rem; color: var(--muted); border-top: 1px solid var(--line); }
@media (max-width: 640px) { .trap { grid-template-columns: 1fr; } }

/* PRÁCTICA */
.setcard { display: grid; gap: 8px; align-content: space-between; }
.setcard .meta { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.q-wrap { max-width: 780px; }
.q-text { font-size: 1.2rem; font-weight: 600; margin-block: 8px 16px; font-family: var(--f-display); }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: 10px; padding: 11px 14px; cursor: pointer; font-size: 1rem; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.opt:hover:not([disabled]) { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.feedback { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-size: .95rem; }
.feedback.ok { background: var(--ok-soft); } .feedback.bad { background: var(--bad-soft); }
.feedback b { display: block; margin-bottom: 2px; }
.typed { display: flex; gap: 8px; flex-wrap: wrap; }
.typed input { flex: 1 1 220px; font-size: 1.05rem; }
.ord { display: grid; gap: 8px; }
.ord-item { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); }
.ord-item.right { border-color: var(--ok); background: var(--ok-soft); }
.ord-item.wrong { border-color: var(--bad); background: var(--bad-soft); }
.ord-item .no { font-weight: 800; color: var(--muted); text-align: center; }
.ord-item .mv { display: flex; gap: 4px; }
.mv button { border: 1px solid var(--line); background: var(--card); border-radius: 7px; width: 32px; height: 32px; cursor: pointer; }
.mv button:hover:not([disabled]) { border-color: var(--accent); }
.proof { font-family: var(--f-serif); font-size: 1.15rem; line-height: 2.1; padding: 16px 18px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.tok { cursor: pointer; border-radius: 5px; padding: 1px 2px; border: 0; background: transparent; font: inherit; color: inherit; }
.tok:hover { background: var(--accent-soft); }
.tok.sel { background: var(--warn-soft); box-shadow: inset 0 -2px 0 var(--warn); }
.tok.found { background: var(--ok-soft); box-shadow: inset 0 -2px 0 var(--ok); }
.tok.missed { background: var(--warn-soft); box-shadow: inset 0 -2px 0 var(--warn); }
.tok.fp { background: var(--bad-soft); box-shadow: inset 0 -2px 0 var(--bad); text-decoration: line-through; }
.run-top { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.summary-big { font-family: var(--f-display); font-size: 3.4rem; font-weight: 800; line-height: 1; }
.rev { padding: 12px 14px; border-left: 4px solid var(--bad); background: var(--card); border-radius: 0 10px 10px 0; border: 1px solid var(--line); border-left-width: 4px; border-left-color: var(--bad); }

/* TALLER */
.lab { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 980px) { .lab { grid-template-columns: minmax(0, 1fr); } }
.lab-col { display: grid; gap: 16px; min-width: 0; }
.task { border-left: 4px solid var(--accent); }
.task .en { font-family: var(--f-serif); font-size: 1.05rem; line-height: 1.6; }
.pt { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; font-size: .9rem; }
.pt label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
textarea.ed { width: 100%; min-height: 380px; resize: vertical; background: var(--card); border: 1.5px solid var(--line); border-radius: var(--r); padding: 16px 18px; line-height: 1.7; font-size: 1.05rem; }
textarea.ed:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.counters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: .86rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.counters b { color: var(--ink); }
.banner { padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: .9rem; display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
.pgroup { margin-block: 8px; }
.pgroup .up { margin-bottom: 4px; display: block; }
.phr { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 3px 9px; font-size: .84rem; cursor: pointer; margin: 0 4px 4px 0; }
.phr:hover { border-color: var(--accent); background: var(--accent-soft); }
.report { position: sticky; top: 64px; }
@media (max-width: 980px) { .report { position: static; } }

[/\b(where|what|when|why|how|which)\s+(I|you|he|she|it|we|they)\s+(are|is|am|do|does|did|can|have|has|will|was|were)\b/gi,'wo',(m,w,s,a)=>w+' '+a+' '+s,1],
[/\b(am|is|are|get|got)\s+used\s+to\s+(go|travel|play|wear|eat|have|live|be|wake|get|do|read|walk)\b/gi,'hb',(m,a,v)=>a+' used to '+ing(L(v))],
[/\b(didn't|did not)\s+used\s+to\b/gi,'hb',(m,a)=>a+' use to'],
[/\b(I|we|they|you|he|she|it)\s+use\s+to\b/gi,'hb',(m,a)=>a+' used to'],
[/(?<!(?:am|is|are|get|got|gets|be|been|['’]m|['’]re|['’]s|getting)\s)\bused\s+to\s+\w+ing\b/gi,'hb',null],
[/\bsince\s+(a|an|one|two|three|four|five|six|several|\d+)\s+(day|week|month|year|hour)s?\b/gi,'tn',m=>m.replace(/^since/i,'for')],
[/\b(yesterday|last\s+\w+|\w+\s+ago)\b[^.!?]*?\b(have|has)\s+(?!to\b)\w+/gi,'tn',null],
[/\b(will|can|must|should|could|would)\s+to\b/gi,'tn',(m,a)=>a],
[/\b(am|is|are)\s+going\s+(?!to\b)(visit|buy|play|travel|go|see|wear|try|take|have)\b/gi,'tn',(m,a,v)=>a+' going to '+v],
[/\b(am|is|are)\s+(play|go|travel|wear|visit|buy|eat|watch|read|wait|stay)\b/gi,'tn',(m,a,v)=>a+' '+ing(L(v))],
[/\bbecause\s+of\s+(I|he|she|we|they|it)\b/gi,'cn',(m,s)=>'because '+s],
[/\bin\s+the\s+other\s+hand\b/gi,'cn',()=>'On the other hand'],

[/\b(do|make)\s+(a\s+)?(trip|journey)\b/gi,'vc',(m,v,a,t)=>'take '+(a||'')+t],

[/\b(advices|informations|luggages|baggages)\b/gi,'vc',m=>m.slice(0,-1)],
[/\bwin\s+(me|you|him|her|them|us)\b/gi,'vc',(m,o)=>'beat '+o],
[/\bgo\s+to\s+the\s+shopping\b/gi,'vc',()=>'go shopping']];

function runHTML(){const R=ER.run;if(!R)return'';if(R.hunt)return huntHTML(R);

${R.done?`<div class="feedback ${R.last?'ok':'bad'}"><b>${R.last?'Correct!':'Not quite.'}</b>Tu respuesta: ${esc(R.val)}<br>Correcto: <b>${esc(it.right)}</b>${it.errs.map(e=>`<br><span class="chip acc">${CAT[e.c]}</span> <span class="small">${RULE[e.c]}</span>`).join('')}</div><p><button class="btn" data-act="nxt">Siguiente</button></p>`:`<div class="typed"><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(it.wrong)}"><button class="btn" data-act="chk">Comprobar</button></div><div class="row" style="margin-top:10px"><button class="btn sec sm" data-act="hint">Pista</button>${R.hint?`<span class="chip warn">${it.errs.map(e=>CAT[e.c]).join(' + ')}</span>`:''}</div>`}</div>`}
function huntHTML(R){const P=R.p,hit=i=>P.toks.some(t=>t.e===i&&R.sel.has(P.toks.indexOf(t)));

${R.done?`<div class="feedback ${R.found==P.errs.length&&!R.fp?'ok':'bad'}"><b>${R.found}/${P.errs.length} errores encontrados${R.fp?` · ${R.fp} falsas alarmas`:''}</b><ul class="tight">${P.errs.map(e=>`<li><s>${esc(e.w)}</s> → <b>${esc(e.r)||'(quitar)'}</b> <span class="chip acc">${CAT[e.c]}</span></li>`).join('')}</ul></div>`:`<p style="margin-top:12px"><button class="btn" data-act="hchk">Comprobar</button></p>`}</div>`}

<div class="row" style="margin:10px 0">${cn.map(c=>`<span class="chip acc">${c}</span>`).join('')||'<span class="muted small">Sin conectores todavía</span>'}</div>
${ck.map(x=>`<div class="chk ${x[1]?'ok':'warn'}"><span class="ic">${x[1]?'✓':'!'}</span><div>${x[0]}<div class="tip">${x[2]}</div></div></div>`).join('')}
<h4 style="margin-top:14px">Errores detectados</h4>${errs.length?errs.slice(0,20).map(e=>`<div class="ecard"><div class="ctx">${esc(tx.slice(Math.max(0,e.i-30),e.i))}<mark>${esc(tx.substr(e.i,e.l))}</mark>${esc(tx.slice(e.i+e.l,e.i+e.l+30))}</div><div><span class="chip acc">${CAT[e.c]}</span> ${e.rep?`→ <b>${esc(e.rep)}</b>`:'<span class="small muted">Revisa la regla.</span>'}</div></div>`).join(''):'<p class="muted small">No se han detectado errores típicos. ¡Revisa también a mano!</p>'}
${cats.length?`<details style="margin-top:12px"><summary>Reglas para repasar</summary><div class="inner">${cats.map(c=>`<p><b>${CAT[c]}</b><br><span class="small">${RULE[c]}</span></p>`).join('')}</div></details>`:''}`}
/* EVENTS */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-g],[data-t],[data-m],[data-c]');if(!b)return;const d=b.dataset,R=ER.run;
if(d.act=='go'){if(ER.mode=='fix')ER.run={items:shuf(ITEMS.filter(x=>ER.cat=='all'||x.errs.some(y=>y.c==ER.cat))).slice(0,10),i:0,ok:0};else{const p=PARAS[ER.pi++%PARAS.length];ER.run={hunt:1,p,sel:new Set()}}renderErrors()}
else if(d.m){ER.mode=d.m;ER.run=null;renderErrors()}else if(d.c){ER.cat=d.c;renderErrors()}
else if(d.act=='hint'){R.hint=1;renderErrors()}
else if(d.act=='chk'){const it=R.items[R.i];R.val=$('#ans').value;R.last=norm(R.val)==norm(it.right)||(it.alts||[]).some(a=>norm(a)==norm(R.val));if(R.last)R.ok++;it.errs.forEach(x=>rec(x.c,R.last));R.done=1;renderErrors()}
else if(d.act=='nxt'){R.i++;R.done=0;R.hint=0;renderErrors()}
else if(d.act=='tk'&&!R.done){const i=+d.i;R.sel.has(i)?R.sel.delete(i):R.sel.add(i);renderErrors()}
else if(d.act=='hchk'){R.done=1;R.found=0;R.p.errs.forEach((x,i)=>{const h=R.p.toks.some((t,k)=>t.e===i&&R.sel.has(k));rec(x.c,h);if(h)R.found++});R.fp=[...R.sel].filter(k=>R.p.toks[k].e==null).length;renderErrors()}
else if(d.act=='reset'){DB.st={};save();meter();renderErrors()}
else if(d.g&&$('#lab').classList.contains('on')){LAB.g=d.g;renderLab()}else if(d.g)LAB.g=d.g;
else if(d.t){LAB.t=d.t;renderLab()}
else if(d.act=='an')analyze();
else if(d.act=='clr'){LAB.txt='';renderLab()}
else if(d.act=='fixall'){let t=LAB.txt;[...LAB.errs].reverse().forEach(x=>{if(x.rep!=null)t=t.slice(0,x.i)+x.rep+t.slice(x.i+x.l)});LAB.txt=t;renderLab();analyze()}});
document.addEventListener('input',e=>{if(e.target.id=='ed'){LAB.txt=e.target.value;cnt()}});
document.addEventListener('keydown',e=>{if(e.key!='Enter'||e.repeat)return;if(e.target.id=='ans'){e.preventDefault();$('[data-act=chk]').click()}else if(e.target==document.body){const n=$('[data-act=nxt]');if(n){e.preventDefault();n.click()}}});
/* ROUTER */
const VIEWS=['blog','article','vocab','errors','lab'],RN={blog:()=>renderGenre('blog'),article:()=>renderGenre('article'),vocab:renderVocab,errors:renderErrors,lab:renderLab};
function route(){const v=VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):'blog';VIEWS.forEach(x=>$('#'+x).classList.toggle('on',x==v));document.querySelectorAll('#tabs a').forEach(a=>a.toggleAttribute('aria-current',a.dataset.v==v)||a.removeAttribute('aria-current'));document.querySelectorAll('#tabs a').forEach(a=>{if(a.dataset.v==v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});RN[v]();window.scrollTo(0,0)}
addEventListener('hashchange',route);
let TH=0;$('#themeBtn').onclick=()=>{TH=(TH+1)%3;const v=['auto','light','dark'][TH];v=='auto'?document.documentElement.removeAttribute('data-theme'):document.documentElement.setAttribute('data-theme',v);$('#themeBtn').textContent='Tema: '+v};
meter();route();
</script>
</body></html>
